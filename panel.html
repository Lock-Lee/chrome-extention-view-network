<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>View Network</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body data-mode="panel">
    <header class="bar">
      <div class="brand">
        <img src="icons/icon48.png" alt="" width="20" height="20" />
        <span>View Network</span>
      </div>
      <button id="record" class="record" type="button">
        <span class="dot" aria-hidden="true"></span><span class="label">กำลังบันทึก</span>
      </button>
      <div class="spacer"></div>
      <button id="clear" class="ghost" type="button" title="ล้างรายการ">ล้าง</button>
      <button id="export" class="ghost" type="button" title="ดาวน์โหลดเป็นไฟล์ .har (เปิดได้ใน Chrome DevTools, Postman, Charles)">⬇ HAR</button>
    </header>

    <div class="filters">
      <input id="search" type="search" placeholder="ค้นหา URL, method, status…   (กด / )" autocomplete="off" />
      <div class="chips" role="group" aria-label="ตัวกรอง">
        <button class="chip" data-chip="all" type="button">ทั้งหมด <span class="count">0</span></button>
        <button class="chip" data-chip="api" type="button">API <span class="count">0</span></button>
        <button id="chip-error" class="chip error" data-chip="error" type="button">Error <span class="count">0</span></button>
      </div>
    </div>

    <main>
      <ul id="list" class="list"></ul>
      <div id="empty" class="empty" hidden>
        <div class="empty-icon" aria-hidden="true">📡</div>
        <h2 id="empty-title"></h2>
        <p id="empty-text"></p>
        <button id="empty-reload" class="primary" type="button">↻ รีโหลดหน้าเว็บ</button>
      </div>
    </main>

    <footer class="foot">
      <span id="total"></span>
      <label class="scope"><input id="scope" type="checkbox" /> แสดงทุกแท็บ</label>
      <span id="shortcut"></span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="ui.js"></script>
  </body>
</html>
